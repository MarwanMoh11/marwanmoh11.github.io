      <div class="head"><div><h2>The light grows</h2><div class="sub">Level ${P.level}. Choose one.</div></div>${this.buildHTML()}</div>
      <div class="cards">${cards}</div>
      <div class="row end"><button class="btn ghost" data-act="skip">Skip and mend 10</button><button class="btn" data-act="reroll" ${P.rerolls > 0 ? '' : 'disabled'}>Reroll · ${P.rerolls}</button></div>
    </div>`);
  },
  choose(i) {
    const c = this.choices[i];
    if (!c) return;
    Game.applyChoice(c);
    Sound.choose();
    this.choices = null;
    this.hideAll(); Game.state = 'play'; P.iframes = Math.max(P.iframes, 0.6);
  },
  buildHTML() {
    const ws = P.weapons.map((w) => `<span class="slot ${w.evo ? 'e' : ''}" title="${esc(w.def.name)}">${icon(w.def.icon)}<b>${w.evo ? '★' : w.level}</b></span>`);
    while (ws.length < 6) ws.push('<span class="slot empty"></span>');
    const ps = P.passives.map((p) => `<span class="slot p" title="${esc(PASSIVES[p.id].name)}">${icon(PASSIVES[p.id].icon)}<b>${p.level}</b></span>`);
    while (ps.length < 6) ps.push('<span class="slot p empty"></span>');
    return `<div class="build"><div class="set">${ws.join('')}</div><div class="set">${ps.join('')}</div></div>`;
  },
  renderSlots() {
    const ws = P.weapons.map((w) => `<span class="slot ${w.evo ? 'e' : ''}">${icon(w.def.icon)}<b>${w.evo ? '★' : w.level}</b></span>`);
    while (ws.length < 6) ws.push('<span class="slot empty"></span>');
    const ps = P.passives.map((p) => `<span class="slot p">${icon(PASSIVES[p.id].icon)}<b>${p.level}</b></span>`);
    while (ps.length < 6) ps.push('<span class="slot p empty"></span>');
    $('#slots').innerHTML = `<div class="set">${ws.join('')}</div><div class="set">${ps.join('')}</div>`;
  },

  // ---------------- chest ----------------
  showChest(rewards, tier) {
    Sound.chest();
    if (rewards.some((r) => r.type === 'evo')) setTimeout(() => Sound.evolve(), 500);
    const rows = rewards.map((r, i) => {
      const delay = `style="animation-delay:${0.35 + i * 0.28}s"`;
      if (r.type === 'evo') { const ev = EVOS[r.id]; return `<div class="relic evo" ${delay}><span class="ico">${icon(ev.icon)}</span><div><span class="pill evo">Evolution</span><h3>${esc(ev.name)}</h3><p>${esc(WEAPONS[ev.from].name)} becomes ${esc(ev.name)}. ${esc(ev.blurb)}</p></div></div>`; }
      if (r.type === 'up') { const w = WEAPONS[r.id]; return `<div class="relic" ${delay}><span class="ico">${icon(w.icon)}</span><div><h3>${esc(w.name)}</h3><p>Now level ${r.level}. ${esc(w.lv[r.level - 2].t)}</p></div></div>`; }
      if (r.type === 'pup') { const p = PASSIVES[r.id]; return `<div class="relic" ${delay}><span class="ico" style="color:var(--soul)">${icon(p.icon)}</span><div><h3>${esc(p.name)}</h3><p>Now level ${r.level}. ${esc(p.blurb)}</p></div></div>`; }
      return `<div class="relic" ${delay}><span class="ico">${icon('coin')}</span><div><h3>${r.amount} tallow</h3><p>${r.minor ? 'Wax pooled in the corners of the box.' : 'Nothing left to hone, so you take the tallow.'}</p></div></div>`;
    }).join('');
    UI.renderSlots();
    this.show('chest', `<div class="wrap">
      <div class="chest-burst"></div>
      <h2>${tier >= 3 ? 'A great reliquary opens' : 'A reliquary opens'}</h2>
      <div class="relic-list">${rows}</div>
      <button class="btn primary" data-act="take" data-autofocus style="opacity:0;animation:rise .4s var(--ease) ${0.5 + rewards.length * 0.28}s forwards">Take them</button>
    </div>`);
  },

  // ---------------- pause ----------------
  showPause() {
    this.returnTo = 'pause'; this.confirmQuit = false;
    this.show('pause', `<div class="wrap">
      <div class="head"><div><h2>The vigil holds</h2><div class="sub">Paused at ${fmtTime(Game.time)}. The dark will wait.</div></div>
        <div class="row"><button class="btn ghost danger" data-act="quit" id="quitBtn">Abandon the night</button><button class="btn" data-act="optionsP">Options</button><button class="btn primary" data-act="resume" data-autofocus>Resume</button></div></div>
      ${this.buildHTML()}
      ${this.runStatsHTML()}
      <div class="split">${this.weaponTable()}<div class="statlist">${this.statList()}</div></div>
    </div>`);
  },
  runStatsHTML(extra = '') {
    return `<div class="statgrid">
      <div class="stat"><span class="label">Survived</span><b class="num">${fmtTime(Game.time)}</b></div>
      <div class="stat"><span class="label">Level</span><b class="num">${P.level}</b></div>
      <div class="stat"><span class="label">Banished</span><b class="num">${fmtNum(Game.kills)}</b></div>
      <div class="stat"><span class="label">Tallow</span><b class="num">${fmtNum(Game.runGold)}</b></div>${extra}
    </div>`;
  },
  weaponTable() {
    const total = P.weapons.reduce((a, w) => a + w.dealt, 0) || 1;
    const rows = P.weapons.slice().sort((a, b) => b.dealt - a.dealt).map((w) => {
      const secs = Math.max(1, Game.time - w.since);
      return `<tr><td><span class="nm"><i class="${w.evo ? 'e' : ''}">${icon(w.def.icon)}</i>${esc(w.def.name)}</span><div class="dmgbar"><span style="width:${((w.dealt / total) * 100).toFixed(1)}%"></span></div></td>
        <td class="r">${w.evo ? '★' : w.level}</td><td class="r">${fmtNum(w.dealt)}</td><td class="r">${fmtNum(w.dealt / secs)}</td><td class="r">${fmtNum(w.kills)}</td></tr>`;
    }).join('');
    return `<div class="tablewrap"><table><thead><tr><th>Arm</th><th class="r">Lv</th><th class="r">Damage</th><th class="r">Per sec</th><th class="r">Banished</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  },
  statList() {
    const s = P.stats, pct = (v) => (v >= 1 ? '+' : '') + Math.round((v - 1) * 100) + '%';
    const rows = [['Max health', Math.round(P.maxHp)], ['Recovery', s.regen.toFixed(1) + '/s'], ['Armor', s.armor], ['Damage', pct(s.might)], ['Area', pct(s.area)], ['Cooldown', '−' + Math.round((1 - s.cooldown) * 100) + '%'], ['Duration', pct(s.duration)], ['Projectiles', '+' + s.amount], ['Move speed', pct(s.speed)], ['Reach', s.magnet.toFixed(1) + 'm'], ['Luck', pct(s.luck)], ['Growth', pct(s.growth)]];
    return rows.map(([k, v]) => `<div><span>${k}</span><b class="num">${v}</b></div>`).join('');
  },

  // ---------------- results ----------------
  showResults({ win, gold, bonus }) {
    const unlock = Game.newUnlocks.length ? `<div class="relic evo" style="animation-delay:.3s"><span class="ico">${icon('lock')}</span><div><span class="pill evo">New wanderer</span><h3>${Game.newUnlocks.map((c) => esc(c.name)).join(', ')}</h3><p>Waiting for you on the character screen.</p></div></div>` : '';
    this.show('results', `<div class="wrap">
      <div class="head"><div><h2 class="${win ? 'win' : 'lose'}">${win ? 'Dawn breaks' : 'The light went out'}</h2>
      <div class="sub">${win ? 'You carried the lantern through the whole night. The moor goes quiet.' : `${esc(P.char.name)} fell at ${fmtTime(Game.time)}, ${fmtTime(NIGHT_LENGTH - Game.time)} short of dawn.`}</div></div>${this.buildHTML()}</div>
      ${this.runStatsHTML(`<div class="stat"><span class="label">Tallow kept</span><b class="num" style="color:var(--lantern-hot)">+${fmtNum(gold)}</b></div>`)}
      ${unlock}
      ${this.weaponTable()}
      <div class="row end"><button class="btn ghost" data-act="toTitle">Title</button><button class="btn" data-act="shrine">Shrine</button><button class="btn" data-act="chars">Wanderers</button><button class="btn primary" data-act="again" data-autofocus>Another night</button></div>
    </div>`);
  },
  checkUnlocks() {
    const d = Save.data, s = d.stats, out = [];
    for (const c of CHARS) {
      if (d.chars[c.id] || !c.unlock) continue;
      const u = c.unlock, v = u.v;
      const ok = (u.kind === 'time' && s.bestTime >= v) || (u.kind === 'level' && s.bestLevel >= v) || (u.kind === 'kills' && s.kills >= v) || (u.kind === 'evo' && s.evolutions >= v) || (u.kind === 'gold' && s.goldTotal >= v) || (u.kind === 'win' && s.wins >= v);
      if (ok) { d.chars[c.id] = true; out.push(c); }
    }
    return out;
  },

  // ---------------- actions ----------------
  act(a, b) {
    switch (a) {
      case 'chars': this.chars(); break;
      case 'shrine': this.shrine(); break;
      case 'codex': this.codex(); break;
      case 'options': this.returnTo = 'title'; this.confirmReset = false; this.options('title'); break;
      case 'optionsP': this.options('pause'); break;
      case 'back': this.back(); break;
      case 'toTitle': this.title(); break;
      case 'pickchar': {
        const id = b.dataset.id;
        if (!Save.data.chars[id]) { b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 }); return; }
        Save.data.selected = id; Save.save();
        for (const el of $$('.charcard')) { const on = el.dataset.id === id; el.classList.toggle('sel', on); el.setAttribute('aria-pressed', on); }
        Game.setPlayerModel(CHAR[id]); P.char = CHAR[id];
        break;
      }
      case 'start': case 'again': this.hideAll(); Game.newRun(); break;
      case 'buy': {
        const it = SHRINE.find((x) => x.id === b.dataset.id), d = Save.data, rank = d.shrine[it.id] || 0;
        if (rank >= it.max) return;
        const cost = shrineCost(it);
        if (d.gold < cost) { b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 }); return; }
        d.gold -= cost; d.spent += cost; d.shrine[it.id] = rank + 1; Save.save(); Sound.gold();
        const id = it.id; this.shrine();
        const again = $(`#shrine [data-id="${id}"]`); if (again) again.focus();
        break;
      }
      case 'refund': { const d = Save.data; d.gold += d.spent; d.spent = 0; d.shrine = {}; Save.save(); this.shrine(); break; }
      case 'tab': this.codexTab = b.dataset.id; this.codex(); { const t = $(`#codex [data-id="${this.codexTab}"]`); if (t) t.focus(); } break;
      case 'opt': {
        const id = b.dataset.id; let v = b.dataset.v;
        if (v === 'true') v = true; else if (v === 'false') v = false;
        Save.data.opts[id] = v; Save.save();
        if (id === 'quality') World.setQuality(v);
        if (id === 'fps') $('#fps').hidden = !(v && Game.state !== 'title');
        this.options(); { const t = $(`#options [data-id="${id}"][data-v="${b.dataset.v}"]`); if (t) t.focus(); }
        break;
      }
      case 'reset': {
        if (!this.confirmReset) { this.confirmReset = true; b.textContent = 'Press again to erase all progress'; return; }
        Save.reset(); this.confirmReset = false; this.options('title'); Game.setPlayerModel(CHAR[Save.data.selected]);
        break;
      }
      case 'choose': this.choose(+b.dataset.i); break;
      case 'skip': healPlayer(10); this.choices = null; this.hideAll(); Game.state = 'play'; break;
      case 'reroll': if (P.rerolls > 0 && this.current === 'levelup') { P.rerolls--; this.showLevelUp(Game.rollChoices()); } break;
      case 'take': this.hideAll(); Game.state = 'play'; P.iframes = Math.max(P.iframes, 0.8); break;
      case 'resume': Game.resume(); break;
      case 'quit': {
        if (!this.confirmQuit) { this.confirmQuit = true; b.textContent = 'Press again to abandon'; return; }
        this.hideAll(); Game.endRun(false);
        break;
      }
    }
  },
};

// ==== 70-main.js ====
// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function boot() {
  Save.load();
  const loading = $('#loading');
  try {
    Game.init();
  } catch (err) {
    loading.classList.add('err');
    loading.querySelector('p').textContent = 'This browser could not start WebGL, so the moor cannot be drawn. Try a current Chrome, Edge, Firefox or Safari.';
    console.error(err);
    return;
  }
  Input.init();
  UI.init();
  Game.enterTitle();
  UI.title();

  const unlock = () => {
    Sound.init(); Sound.resume();
    Sound.music(Game.state === 'play' ? 'play' : 'title');
    removeEventListener('pointerdown', unlock, true); removeEventListener('keydown', unlock, true);
  };
  addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true);
  document.addEventListener('visibilitychange', () => { if (document.hidden) Sound.suspend(); else Sound.resume(); });

  let last = performance.now(), fpsT = 0, fpsN = 0, slow = 0;
  const fpsEl = $('#fps');
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    Input.pollPad();
    Game.tick(dt);
    Game.draw(dt);
    renderer.render(scene, camera);
    fpsT += dt; fpsN++;
    if (fpsT > 0.5) {
      const fps = fpsN / fpsT;
      if (!fpsEl.hidden) fpsEl.textContent = Math.round(fps) + ' FPS · ' + enemies.length + ' foes';
      // dynamic resolution: if the moor is struggling for a few seconds, render fewer pixels
      if (Game.state === 'play' && document.visibilityState === 'visible') { slow = fps < 42 ? slow + 1 : 0; if (slow >= 6) { World.dropResolution(); slow = 0; } }
      fpsT = 0; fpsN = 0;
    }
  }
  requestAnimationFrame(frame);
  requestAnimationFrame(() => { loading.style.opacity = 0; setTimeout(() => { loading.hidden = true; }, 900); });

  if (window.__GLOAM_TEST__) {
    window.GLOAM = { Game, P, UI, World, Save, get enemies() { return enemies; }, get shots() { return shots; }, get pickups() { return pickups; }, spawnEnemy, Weapon, recomputeStats, EVOS, WEAPONS, PASSIVES, Input, pollPad: () => Input.pollPad() };
  }
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(() => boot()); else boot();

}
if (window.THREE) run();
else {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  s.onload = run;
  s.onerror = function () { var l = document.getElementById('loading'); l.classList.add('err'); l.querySelector('p').textContent = 'The 3D engine could not load. Check your connection and reload.'; };
  document.head.appendChild(s);
}
})();
</script>
