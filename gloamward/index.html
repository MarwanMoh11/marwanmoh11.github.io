<title>Gloamward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: full-bleed 3D moor at night. UI hangs in the dark as hairline-ruled almanac plates:
   edge-anchored HUD, left-weighted title menu, centred modal plates for level-ups and reliquaries. */
:root{
  color-scheme: dark;
  --night:#06080d; --peat:#0e131b; --peat-2:#151c27; --peat-3:#1e2734;
  --rule:rgba(255,186,104,.18); --rule-strong:rgba(255,186,104,.5);
  --bone:#ece3cf; --mist:#9aa3b3; --dim:#5d6677;
  --lantern:#ffb24a; --lantern-hot:#ffd890; --ember:#ff5a3c; --soul:#62dfcd; --rare:#c7a0ff; --frost:#9fd4ff;
  --f-display:"IM Fell English SC","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px; --t-2xl:clamp(30px,4.6vw,46px); --t-hero:clamp(58px,11vw,138px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html,body{height:100%;background:var(--night);color:var(--bone);overflow:hidden}
body{font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#app canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:1px solid var(--lantern);outline-offset:3px}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.label{font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--mist);font-weight:600}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- loading ---------- */
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--night);z-index:50;transition:opacity .8s var(--ease)}
#loading .flame{width:14px;height:22px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,var(--lantern-hot),var(--lantern) 45%,transparent 72%);animation:flick 1.4s infinite ease-in-out;margin:0 auto 18px}
#loading p{font-family:var(--f-display);font-size:var(--t-lg);color:var(--mist);text-align:center}
#loading.err p{color:var(--ember)}
@keyframes flick{0%,100%{transform:scale(1,1) translateY(0);opacity:1}40%{transform:scale(.9,1.08) translateY(-1px);opacity:.85}70%{transform:scale(1.05,.95);opacity:.95}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;animation:fadeIn .35s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scrim{background:radial-gradient(120% 90% at 50% 40%,rgba(6,8,13,.78),rgba(6,8,13,.95))}
#chars.scrim,#shrine.scrim,#codex.scrim,#options.scrim{background:radial-gradient(120% 90% at 50% 40%,rgba(6,8,13,.82),rgba(6,8,13,.96))}
.plate{background:linear-gradient(180deg,rgba(21,28,39,.94),rgba(14,19,27,.96));border:1px solid var(--rule);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,170,.05)}
.wrap{width:100%;max-width:1040px;margin:auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:14px}
.head h2{font-family:var(--f-display);font-size:var(--t-2xl);font-weight:400;line-height:1;text-wrap:balance}
.head .sub{color:var(--mist);font-size:var(--t-md);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:1px solid var(--rule-strong);color:var(--bone);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:var(--t-sm);transition:background .15s,border-color .15s,color .15s}
.btn:hover,.btn:focus-visible{background:rgba(255,178,74,.12);border-color:var(--lantern);color:var(--lantern-hot);outline:none}
.btn.primary{background:var(--lantern);color:#1a1006;border-color:var(--lantern)}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--lantern-hot);color:#1a1006}
.btn.ghost{border-color:transparent;color:var(--mist)}
.btn.ghost:hover,.btn.ghost:focus-visible{color:var(--bone);border-color:var(--rule)}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.tallow{display:inline-flex;align-items:center;gap:6px;color:var(--lantern-hot);font-weight:600;font-size:var(--t-md)}
.tallow i{width:16px;height:16px;display:inline-block;color:var(--lantern)}

/* ---------- title ---------- */
#title{justify-content:flex-end;background:linear-gradient(90deg,rgba(6,8,13,.92) 0%,rgba(6,8,13,.55) 40%,rgba(6,8,13,0) 70%),linear-gradient(0deg,rgba(6,8,13,.8),rgba(6,8,13,0) 45%)}
#title .inner{padding:0 0 clamp(8px,4vh,48px) clamp(4px,5vw,72px);display:flex;flex-direction:column;gap:clamp(18px,3vh,30px);max-width:640px}
#title h1{font-family:var(--f-display);font-weight:400;font-size:var(--t-hero);line-height:.82;letter-spacing:-.01em;color:var(--bone);text-shadow:0 0 40px rgba(255,170,70,.18)}
#title h1 span{display:block;font-size:.26em;letter-spacing:.32em;color:var(--lantern);margin:0 0 .9em .25em;line-height:1;text-shadow:none}
#title .tag{font-size:var(--t-lg);color:var(--mist);max-width:34ch;line-height:1.35}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.menu button{position:relative;font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);color:var(--mist);padding:6px 0 6px 30px;transition:color .15s,transform .2s var(--ease);text-align:left}
.menu button::before{content:"";position:absolute;left:6px;top:50%;width:9px;height:14px;margin-top:-7px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,var(--lantern-hot),var(--lantern) 50%,transparent 75%);opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s var(--ease)}
.menu button:hover,.menu button:focus-visible{color:var(--bone);transform:translateX(4px);outline:none}
.menu button:hover::before,.menu button:focus-visible::before{opacity:1;transform:scale(1);animation:flick 1.4s infinite}
.menu button.primary{color:var(--lantern-hot)}
#title .foot{display:flex;gap:22px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
#title .foot b{color:var(--mist);font-weight:600}

/* ---------- cards (level-up, chars, shrine) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px 18px 20px;background:linear-gradient(180deg,var(--peat-2),var(--peat));border:1px solid var(--rule);transition:border-color .15s,transform .2s var(--ease),box-shadow .2s;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--lantern);transform:translateY(-3px);box-shadow:0 0 0 1px var(--lantern),0 18px 40px rgba(255,160,60,.12);outline:none}
.card .ico{width:54px;height:54px;padding:11px;border:1px solid var(--rule);border-radius:50%;color:var(--lantern);background:radial-gradient(circle,rgba(255,178,74,.12),transparent 70%);flex:none}
.card.evo .ico,.card .ico.evo{color:var(--rare);border-color:rgba(199,160,255,.5);background:radial-gradient(circle,rgba(199,160,255,.18),transparent 70%)}
.card .ico.passive{color:var(--soul);border-color:rgba(98,223,205,.4);background:radial-gradient(circle,rgba(98,223,205,.1),transparent 70%)}
.card h3{font-family:var(--f-display);font-weight:400;font-size:var(--t-xl);line-height:1.05;text-wrap:balance}
.card p{color:var(--mist);font-size:var(--t-md);line-height:1.35}
.card .key{position:absolute;top:12px;right:14px;font-size:var(--t-xs);color:var(--dim);font-weight:700;letter-spacing:.1em}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 8px;border:1px solid var(--rule);color:var(--mist)}
.pill.new{color:var(--soul);border-color:rgba(98,223,205,.45)}
.pill.evo{color:var(--rare);border-color:rgba(199,160,255,.5)}
.pill.up{color:var(--lantern);border-color:rgba(255,178,74,.4)}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;border:1px solid var(--rule-strong);transform:rotate(45deg)}
.pips i.on{background:var(--lantern);border-color:var(--lantern)}
.pips i.next{background:rgba(255,178,74,.25);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ---------- level up ---------- */
#levelup .wrap{max-width:1000px}
#levelup .head h2{color:var(--lantern-hot)}
#levelup .card{animation:rise .45s var(--ease) both}
#levelup .card:nth-child(2){animation-delay:.06s}#levelup .card:nth-child(3){animation-delay:.12s}#levelup .card:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.build{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.build .set{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:34px;height:34px;padding:6px;border:1px solid var(--rule);color:var(--lantern);position:relative;background:rgba(0,0,0,.3)}
.slot.p{color:var(--soul)}
.slot.e{color:var(--rare);border-color:rgba(199,160,255,.45)}
.slot.empty{opacity:.35}
.slot b{position:absolute;right:-1px;bottom:-1px;font-size:10px;line-height:1;padding:2px 3px;background:var(--night);color:var(--bone);font-weight:700}

/* ---------- chest ---------- */
#chest .wrap{max-width:620px;text-align:center;align-items:center}
#chest h2{font-family:var(--f-display);font-size:var(--t-2xl);font-weight:400;color:var(--lantern-hot)}
.relic-list{display:flex;flex-direction:column;gap:10px;width:100%}
.relic{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--rule);background:linear-gradient(90deg,rgba(255,178,74,.08),transparent);opacity:0;animation:rise .5s var(--ease) forwards}
.relic.evo{border-color:rgba(199,160,255,.6);background:linear-gradient(90deg,rgba(199,160,255,.16),transparent)}
.relic .ico{width:46px;height:46px;padding:9px;border-radius:50%;border:1px solid var(--rule);color:var(--lantern);flex:none}
.relic.evo .ico{color:var(--rare);border-color:rgba(199,160,255,.6)}
.relic h3{font-family:var(--f-display);font-weight:400;font-size:var(--t-lg)}
.relic p{color:var(--mist);font-size:var(--t-sm)}
.chest-burst{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,144,.9),rgba(255,178,74,.35) 35%,transparent 70%);animation:burst 1.2s var(--ease) both}
@keyframes burst{from{transform:scale(.2);opacity:0}40%{opacity:1}to{transform:scale(1);opacity:.85}}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
#xpbar{position:absolute;left:0;right:0;top:0;height:calc(12px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:rgba(4,6,10,.75);border-bottom:1px solid rgba(98,223,205,.25)}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,#2b8f86,var(--soul));box-shadow:0 0 12px rgba(98,223,205,.6);transition:width .12s linear}
#lvl{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));font-family:var(--f-display);font-size:var(--t-lg);color:var(--soul);text-shadow:0 1px 3px #000}
.hud-row{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:calc(20px + env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px}
#slots{display:flex;flex-direction:column;gap:4px}
#slots .set{display:flex;gap:4px}
#slots .slot{width:28px;height:28px;padding:5px;background:rgba(4,6,10,.6)}
#slots .slot b{font-size:9px}
#clock{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
#time{font-family:var(--f-display);font-size:clamp(30px,4vw,40px);line-height:1;color:var(--bone);text-shadow:0 2px 10px rgba(0,0,0,.9)}
#dawn{width:150px;height:4px;background:rgba(255,255,255,.08);position:relative}
#dawnfill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#3b3f73,#b4628a,#ffb46b)}
#dawn::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#ffcf87;box-shadow:0 0 10px #ffb46b}
#dawnlabel{white-space:nowrap;font-size:var(--t-xs);letter-spacing:.14em;color:var(--mist);text-transform:uppercase;font-weight:600;text-shadow:0 1px 3px #000}
#tally{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:26px;font-size:var(--t-md);font-weight:600;text-shadow:0 1px 3px #000}
#tally span{display:inline-flex;align-items:center;gap:6px}
#tally i{width:15px;height:15px;display:inline-block}
#tally .k{color:var(--bone)}#tally .g{color:var(--lantern-hot)}
#pauseBtn{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:44px;height:44px;padding:12px;pointer-events:auto;color:var(--mist);border:1px solid var(--rule);background:rgba(4,6,10,.5)}
#pauseBtn:hover{color:var(--bone)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));width:min(520px,80vw);text-align:center}
#bossbar .nm{font-family:var(--f-display);font-size:var(--t-lg);color:#ffd2c4;text-shadow:0 2px 8px #000}
#bossbar .bar{height:8px;margin-top:4px;background:rgba(0,0,0,.6);border:1px solid rgba(255,90,60,.5)}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#7d1a12,var(--ember));transition:width .15s}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#banner.on{opacity:1}
#banner .b1{font-family:var(--f-display);font-size:clamp(30px,5vw,56px);color:var(--bone);text-shadow:0 4px 24px #000,0 0 30px rgba(255,120,60,.25)}
#banner .b2{margin-top:6px;font-size:var(--t-md);letter-spacing:.16em;text-transform:uppercase;color:var(--lantern);font-weight:600;text-shadow:0 2px 8px #000}
#hurt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,10,.55));opacity:0;transition:opacity .25s}
#fps{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));font-size:var(--t-xs);color:var(--dim);font-weight:600;letter-spacing:.08em}
#joy{position:absolute;z-index:11;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(255,186,104,.35);background:radial-gradient(circle,rgba(255,178,74,.06),transparent 70%);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,216,144,.55),rgba(255,178,74,.15) 60%,transparent 72%);border:1px solid rgba(255,186,104,.5)}

/* ---------- pause / results ---------- */
#pause .wrap,#results .wrap{max-width:980px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.split .statlist{grid-template-columns:1fr 1fr}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.stat{background:var(--peat);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:var(--t-xl);line-height:1}
.tablewrap{overflow-x:auto;border:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;font-size:var(--t-md)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid rgba(255,186,104,.08);white-space:nowrap}
th{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--mist);font-weight:600;background:rgba(0,0,0,.25)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .nm{display:flex;align-items:center;gap:10px}
td .nm i{width:22px;height:22px;color:var(--lantern);flex:none}
td .nm i.e{color:var(--rare)}
.dmgbar{height:4px;background:rgba(255,178,74,.15);margin-top:4px;min-width:60px}
.dmgbar span{display:block;height:100%;background:var(--lantern)}
#results h2.win{color:var(--lantern-hot)}
#results h2.lose{color:#d9cbbd}
.statlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;font-size:var(--t-md)}
.statlist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,186,104,.08);padding:4px 0}
.statlist span{color:var(--mist)}

/* ---------- chars ---------- */
.charcard .portrait{height:120px;margin:-6px -6px 4px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 80%,rgba(255,178,74,.16),transparent 65%)}
.charcard .portrait svg{height:110px;width:auto}
.charcard.sel{border-color:var(--lantern);box-shadow:0 0 0 1px var(--lantern) inset}
.charcard.locked{opacity:.6}
.charcard.locked .portrait{filter:grayscale(1) brightness(.4)}
.charcard .weap{display:flex;align-items:center;gap:8px;color:var(--bone);font-weight:600}
.charcard .weap i{width:22px;height:22px;color:var(--lantern)}
.charcard .perk{color:var(--soul);font-size:var(--t-sm)}
.charcard .lock{color:var(--ember);font-size:var(--t-sm);font-weight:600;display:flex;gap:6px;align-items:center}
#chars .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

/* ---------- shrine ---------- */
#shrine .cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.shrinecard{flex-direction:row;align-items:flex-start;gap:14px}
.shrinecard .ico{width:46px;height:46px;padding:10px}
.shrinecard .body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.shrinecard h3{font-size:var(--t-lg)}
.shrinecard .cost{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.shrinecard.max .cost .tallow{color:var(--soul)}
.shrinecard.poor .cost .tallow{color:var(--dim)}
.shrinecard.poor{cursor:not-allowed}
.shrinecard.poor:hover{transform:none;box-shadow:none;border-color:var(--rule)}

/* ---------- codex ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tabs button{padding:10px 16px;color:var(--mist);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:var(--t-sm);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--lantern-hot);border-color:var(--lantern)}
.codexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.entry{display:flex;gap:14px;padding:14px;border:1px solid var(--rule);background:var(--peat);min-width:0}
.entry .ico{width:44px;height:44px;padding:9px;border-radius:50%;border:1px solid var(--rule);color:var(--lantern);flex:none}
.entry.passive .ico{color:var(--soul)}
.entry.evo .ico{color:var(--rare);border-color:rgba(199,160,255,.45)}
.entry.unknown .ico{color:var(--dim)}
.entry.unknown h3{color:var(--dim)}
.entry h3{font-family:var(--f-display);font-weight:400;font-size:var(--t-lg);line-height:1.1}
.entry p{color:var(--mist);font-size:var(--t-sm)}
.entry .recipe{color:var(--rare);font-size:var(--t-sm);margin-top:4px}
.entry .meta{color:var(--dim);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-top:4px}
.beast .ico{color:var(--ember)}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:2px;border:1px solid var(--rule)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;background:var(--peat);flex-wrap:wrap}
.opt label{font-size:var(--t-md);font-weight:600}
.opt small{display:block;color:var(--mist);font-weight:400;font-size:var(--t-sm)}
.opt input[type=range]{width:min(240px,50vw);accent-color:var(--lantern)}
.seg{display:flex;border:1px solid var(--rule-strong)}
.seg button{padding:8px 14px;min-height:40px;color:var(--mist);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:var(--t-xs)}
.seg button[aria-pressed="true"]{background:var(--lantern);color:#1a1006}
.danger{color:var(--ember);border-color:rgba(255,90,60,.5)}
.danger:hover,.danger:focus-visible{background:rgba(255,90,60,.12);color:#ffb0a0;border-color:var(--ember)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;color:var(--mist);font-size:var(--t-md)}
.keys kbd{font-family:var(--f-ui);font-weight:700;color:var(--bone);border:1px solid var(--rule-strong);padding:1px 7px;font-size:var(--t-sm)}

@media (max-width:640px){
  .cards{grid-template-columns:1fr}
  #levelup .card{flex-direction:row;align-items:flex-start;padding:14px}
  #levelup .card .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
  #levelup .card .ico{width:46px;height:46px;padding:9px}
  .card h3{font-size:var(--t-lg)}
  .card p{font-size:var(--t-sm)}
  #slots .slot{width:22px;height:22px;padding:3px}
  #dawn{width:110px}
  #tally{margin-top:22px;font-size:var(--t-sm)}
  .charcard .portrait{height:90px}
  .charcard .portrait svg{height:84px}
  #title .inner{padding-left:4px}
}
@media (min-width:641px){ #levelup .card .txt{display:flex;flex-direction:column;gap:10px} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
function run() {
// ==== 00-util.js ====
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function weightedPick(items, wfn) {
  let tot = 0;
  for (const it of items) tot += wfn(it);
  let r = Math.random() * tot;
  for (const it of items) { r -= wfn(it); if (r <= 0) return it; }
  return items[items.length - 1];
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmtNum = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e5 ? Math.round(n / 1e3) + 'k' : Math.round(n).toLocaleString('en-US'));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// cheap smooth 1D noise for flicker
function noise1(t) { const i = Math.floor(t), f = t - i; const h = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }; const u = f * f * (3 - 2 * f); return lerp(h(i), h(i + 1), u); }

function deepMerge(a, b) {
  for (const k in b) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') deepMerge(a[k], b[k]);
    else a[k] = b[k];
  }
  return a;
}

const SAVE_KEY = 'gloamward.save.v1';
const Save = {
  data: null,
  defaults() {
    return {
      gold: 0, spent: 0, shrine: {}, chars: { lamplighter: true, gravedigger: true }, selected: 'lamplighter',
      stats: { kills: 0, runs: 0, wins: 0, bestTime: 0, bestLevel: 0, goldTotal: 0, evolutions: 0, bosses: {} },
      codex: { w: {}, p: {}, e: {}, evo: {} },
      opts: { music: 0.55, sfx: 0.8, shake: true, dmg: true, quality: 'high', fps: false },
    };
  },
  load() {
    let d = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    this.data = deepMerge(this.defaults(), d || {});
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
  reset() { const opts = this.data.opts; this.data = this.defaults(); this.data.opts = opts; this.save(); },
};

// ==== 10-audio.js ====
// ---------------------------------------------------------------------------
// Audio: every sound is synthesised with WebAudio, no files.
// ---------------------------------------------------------------------------
const Sound = (() => {
  let ctx = null, master, sfx, mus, verb, verbSend, noiseBuf, comp;
  const last = {};
  let gemCombo = 0, gemT = 0;
  const music = { on: false, mode: 'title', next: 0, step: 0, timer: null, drone: null, intensity: 0, boss: false };

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = 0.9;
    sfx = ctx.createGain(); mus = ctx.createGain();
    verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.2);
    verbSend = ctx.createGain(); verbSend.gain.value = 0.9;
    verbSend.connect(verb); verb.connect(comp);
    sfx.connect(comp); mus.connect(comp); comp.connect(master); master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setVolumes();
  }
  function impulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function setVolumes() {
    if (!ctx) return;
    const o = Save.data.opts;
    sfx.gain.setTargetAtTime(o.sfx * 0.9, ctx.currentTime, 0.05);
    mus.gain.setTargetAtTime(o.music * 0.75, ctx.currentTime, 0.1);
  }
  const can = (k, gap) => { if (!ctx) return false; const t = ctx.currentTime; if (last[k] && t - last[k] < gap) return false; last[k] = t; return true; };

  function tone(f, dur, { type = 'sine', vol = 0.1, slide = 0, attack = 0.005, at = 0, dest = null, wet = 0, detune = 0, filter = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (filter) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filter; o.connect(fl); node = fl; }
    node.connect(g); g.connect(dest || sfx);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verbSend); }
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, { vol = 0.1, type = 'bandpass', f = 1000, q = 1, slide = 0, at = 0, dest = null, wet = 0, attack = 0.003 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + at;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (slide) fl.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest || sfx);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verbSend); }
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }

  const S = {
    init, setVolumes,
    get ready() { return !!ctx; },
    ui() { if (can('ui', 0.03)) tone(1400, 0.05, { type: 'triangle', vol: 0.04 }); },
    uiMove() { if (can('uim', 0.03)) tone(900, 0.03, { type: 'sine', vol: 0.025 }); },
    hit() { if (can('hit', 0.035)) noise(0.06, { vol: 0.07, f: 1500 + Math.random() * 900, q: 1.2 }); },
    kill() { if (can('kill', 0.03)) { tone(260 + Math.random() * 60, 0.12, { type: 'triangle', vol: 0.05, slide: 90 }); noise(0.1, { vol: 0.03, type: 'lowpass', f: 900 }); } },
    gem() {
      if (!can('gem', 0.018)) return;
      const t = ctx.currentTime;
      gemCombo = t - gemT < 0.6 ? Math.min(gemCombo + 1, 24) : 0; gemT = t;
      const f = 990 * Math.pow(2, gemCombo / 24);
      tone(f, 0.09, { type: 'sine', vol: 0.045 }); tone(f * 2, 0.05, { type: 'sine', vol: 0.012 });
    },
    gold() { if (can('gold', 0.04)) { tone(1320, 0.1, { type: 'square', vol: 0.025, filter: 3000 }); tone(1980, 0.16, { type: 'square', vol: 0.02, at: 0.05, filter: 3500 }); } },
    heal() { [523, 659, 784].forEach((f, i) => tone(f, 0.25, { type: 'sine', vol: 0.06, at: i * 0.05, wet: 0.3 })); },
    levelUp() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.07, at: i * 0.06, wet: 0.5 })); noise(0.8, { vol: 0.02, type: 'highpass', f: 5000, wet: 0.4 }); },
    choose() { tone(784, 0.3, { type: 'triangle', vol: 0.06, wet: 0.4 }); tone(1175, 0.4, { type: 'sine', vol: 0.04, at: 0.07, wet: 0.5 }); },
    hurt() { if (can('hurt', 0.12)) { tone(160, 0.22, { type: 'sawtooth', vol: 0.09, slide: 55, filter: 700 }); noise(0.15, { vol: 0.06, type: 'lowpass', f: 600 }); } },
    chest() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.7, { type: 'triangle', vol: 0.05, at: i * 0.09, wet: 0.6 })); noise(1.4, { vol: 0.03, type: 'highpass', f: 6000, slide: 9000, wet: 0.5 }); },
    evolve() { [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 1.1, { type: 'sawtooth', vol: 0.03, at: i * 0.07, wet: 0.7, filter: 2400 })); },
    horn() { tone(55, 2.4, { type: 'sawtooth', vol: 0.12, attack: 0.5, filter: 380, wet: 0.6 }); tone(82.4, 2.4, { type: 'sawtooth', vol: 0.08, attack: 0.6, filter: 420, wet: 0.6, detune: 6 }); noise(2.2, { vol: 0.05, type: 'lowpass', f: 220, attack: 0.6 }); },
    death() { tone(220, 2.2, { type: 'sine', vol: 0.1, slide: 40, wet: 0.7 }); noise(2, { vol: 0.06, type: 'lowpass', f: 400, slide: 80, wet: 0.5 }); },
    dawn() { [262, 330, 392, 523, 659, 784].forEach((f, i) => tone(f, 3, { type: 'triangle', vol: 0.06, at: i * 0.18, attack: 0.3, wet: 0.8 })); },
    purge() { noise(1.2, { vol: 0.14, type: 'bandpass', f: 400, slide: 6000, q: 0.7, wet: 0.5 }); tone(98, 1.5, { type: 'sine', vol: 0.12, slide: 40 }); },
    freeze() { [2093, 2637, 3136].forEach((f, i) => tone(f, 0.6, { type: 'sine', vol: 0.03, at: i * 0.05, wet: 0.6 })); },
    magnet() { tone(300, 0.5, { type: 'sine', vol: 0.06, slide: 1200, wet: 0.4 }); },
    breakable() { if (can('brk', 0.05)) { noise(0.18, { vol: 0.08, f: 3000, q: 0.8 }); tone(1800, 0.12, { type: 'triangle', vol: 0.03, slide: 900 }); } },
    // weapons
    bolt() { if (can('bolt', 0.05)) tone(620 + Math.random() * 80, 0.08, { type: 'sine', vol: 0.035, slide: 1100 }); },
    nail() { if (can('nail', 0.05)) noise(0.04, { vol: 0.04, type: 'highpass', f: 4500 }); },
    swing() { if (can('swing', 0.08)) noise(0.22, { vol: 0.08, f: 500, slide: 2600, q: 1.6 }); },
    bell() { if (can('bell', 1.6)) { [392, 784, 1176].forEach((f, i) => tone(f, 1.4 - i * 0.3, { type: 'sine', vol: 0.03 / (i + 1), wet: 0.6 })); } },
    flutter() { if (can('flut', 0.6)) noise(0.25, { vol: 0.025, type: 'lowpass', f: 700, attack: 0.05 }); },
    zap() { if (can('zap', 0.06)) { noise(0.3, { vol: 0.11, type: 'highpass', f: 2200, attack: 0.001 }); tone(70, 0.4, { type: 'sine', vol: 0.1, slide: 35 }); } },
    glass() { if (can('glass', 0.07)) tone(2400 + Math.random() * 400, 0.12, { type: 'sine', vol: 0.03 }); },
    fwoosh() { if (can('fw', 0.1)) noise(0.5, { vol: 0.06, type: 'lowpass', f: 300, slide: 1400, attack: 0.04 }); },
    sickle() { if (can('sick', 0.12)) noise(0.3, { vol: 0.04, f: 1200, slide: 600, q: 3 }); },
    enemyShot() { if (can('es', 0.12)) tone(420, 0.15, { type: 'sine', vol: 0.025, slide: 260 }); },
    charge() { noise(0.9, { vol: 0.1, type: 'lowpass', f: 200, slide: 900, attack: 0.3 }); tone(48, 1, { type: 'sawtooth', vol: 0.07, filter: 300 }); },

    // ---------------- music: drone + sparse modal arpeggio, intensity follows the night ----------------
    music(mode) {
      if (!ctx) return;
      music.mode = mode;
      if (!music.on) { music.on = true; music.next = ctx.currentTime + 0.1; music.timer = setInterval(sched, 60); startDrone(); }
    },
    setIntensity(v, boss) { music.intensity = v; music.boss = !!boss; },
    stopMusic() {
      music.on = false; clearInterval(music.timer);
      if (music.drone) { const d = music.drone; d.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.4); setTimeout(() => d.oscs.forEach((o) => { try { o.stop(); } catch (e) { /* stopped */ } }), 1500); music.drone = null; }
    },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend(); },
  };

  function startDrone() {
    const g = ctx.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(0.05, ctx.currentTime, 2);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320; f.Q.value = 2;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 140; lfo.connect(lg); lg.connect(f.frequency);
    const oscs = [73.42, 73.9, 110, 146.8].map((fr, i) => { const o = ctx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = fr; o.connect(f); o.start(); return o; });
    lfo.start(); oscs.push(lfo);
    f.connect(g); g.connect(mus); const w = ctx.createGain(); w.gain.value = 0.4; g.connect(w); w.connect(verbSend);
    music.drone = { g, oscs, f };
  }
  // D dorian, tuned for a cold moor
  const SCALE = [0, 2, 3, 5, 7, 9, 10];
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const PHRASES = [[0, 2, 4, 3, 2, 0, -1, 0], [4, 5, 4, 2, 3, 2, 0, 1], [0, 4, 7, 6, 4, 2, 4, 3], [2, 1, 0, -2, -1, 0, 2, 4]];
  let phrase = PHRASES[0];
  function noteOf(deg, oct) { const o = Math.floor(deg / 7), i = ((deg % 7) + 7) % 7; return 62 + 12 * (oct + o) + SCALE[i]; }
  function sched() {
    if (!music.on || !ctx) return;
    const bpm = music.mode === 'title' ? 64 : 72 + music.intensity * 26 + (music.boss ? 12 : 0);
    const step = 60 / bpm / 2;
    while (music.next < ctx.currentTime + 0.25) {
      const t = music.next - ctx.currentTime, s = music.step;
      const inten = music.mode === 'title' ? 0.15 : music.intensity;
      if (s % 16 === 0) phrase = pick(PHRASES);
      const deg = phrase[s % 8];
      const prob = music.mode === 'title' ? 0.45 : 0.35 + inten * 0.5;
      if (Math.random() < prob) {
        const n = noteOf(deg, inten > 0.6 && s % 4 === 2 ? 1 : 0);
        tone(midi(n), step * 3.2, { type: 'triangle', vol: 0.028 + inten * 0.012, at: t, attack: 0.01, dest: mus, wet: 0.6, filter: 1800 + inten * 2000 });
      }
      if (s % 8 === 0) tone(midi(noteOf(phrase[0], -2)), step * 7, { type: 'sine', vol: 0.05, at: t, attack: 0.3, dest: mus, wet: 0.3 });
      if (music.mode !== 'title' && inten > 0.2 && (s % 4 === 0 || (music.boss && s % 4 === 3))) {
        tone(62, 0.22, { type: 'sine', vol: 0.09 + inten * 0.05, slide: 38, at: t, dest: mus });
      }
      if (music.mode !== 'title' && inten > 0.55 && s % 2 === 1) noise(0.05, { vol: 0.012 + inten * 0.01, type: 'highpass', f: 7000, at: t, dest: mus });
      music.next += step; music.step++;
    }
    if (music.drone) {
      const target = music.mode === 'title' ? 260 : 300 + music.intensity * 500 + (music.boss ? 300 : 0);
      music.drone.f.frequency.setTargetAtTime(target, ctx.currentTime, 2);
    }
  }
  return S;
})();

// ---- moonlit rim light: a cool fresnel edge so silhouettes read in the dark ----
function rimify(mat, color = 0x40527a, power = 2.2) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uRim = { value: new THREE.Color(color) };
    sh.vertexShader = 'varying float vRim;\n' + sh.vertexShader.replace('#include <lights_lambert_vertex>', '#include <lights_lambert_vertex>\n{ vec3 rn = normalize(transformedNormal); vec3 rv = normalize(-mvPosition.xyz); vRim = pow(1.0 - clamp(abs(dot(rn, rv)), 0.0, 1.0), ' + power.toFixed(2) + '); }');
    sh.fragmentShader = 'uniform vec3 uRim; varying float vRim;\n' + sh.fragmentShader.replace('#include <fog_fragment>', 'gl_FragColor.rgb += vRim * uRim;\n#include <fog_fragment>');
  };
  mat.customProgramCacheKey = () => 'rim' + power;
  return mat;
}

// ---- instanced render batch -------------------------------------------------
class Batch {
  constructor(geom, mat, cap, colored = false) {
    this.mesh = new THREE.InstancedMesh(geom, mat, cap);
    this.mesh.frustumCulled = false;
    this.mesh.count = 0;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.cap = cap; this.n = 0; this.colored = colored;
    if (colored) {
      this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3).fill(1), 3);
      this.mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    }
    scene.add(this.mesh);
  }
  begin() { this.n = 0; }
  push(x, y, z, ry = 0, sx = 1, sy = sx, sz = sx, rx = 0, rz = 0, r = 1, g = 1, b = 1) {
    if (this.n >= this.cap) return;
    _e.set(rx, ry, rz, 'YXZ');
    _m4.compose(_v.set(x, y, z), _q.setFromEuler(_e), _s.set(sx, sy, sz));
    this.mesh.setMatrixAt(this.n, _m4);
    if (this.colored) { _c.setRGB(r, g, b); this.mesh.setColorAt(this.n, _c); }
    this.n++;
  }
  end() {
    this.mesh.count = this.n;
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.colored && this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
}

// ---- immediate-mode glowing point sprites ------------------------------------
class PointBatch {
  constructor(cap, additive = true, fogged = false) {
    this.cap = cap; this.n = 0;
    const g = new THREE.BufferGeometry();
    this.pos = new Float32Array(cap * 3); this.col = new Float32Array(cap * 4); this.size = new Float32Array(cap);
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('acolor', new THREE.BufferAttribute(this.col, 4).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('asize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 400 } },
      vertexShader: `attribute vec4 acolor; attribute float asize; uniform float uScale; varying vec4 vC;
        void main(){ vC=acolor; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=asize*uScale/max(0.5,-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader: `varying vec4 vC; void main(){ vec2 p=gl_PointCoord-.5; float d=length(p)*2.; float a=smoothstep(1.,0.,d); a*=a; gl_FragColor=vec4(vC.rgb*${additive ? 'a*vC.a' : '1.'}, ${additive ? '1.' : 'a*vC.a'}); }`,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.pts = new THREE.Points(g, this.mat); this.pts.frustumCulled = false; this.geom = g;
    scene.add(this.pts);
  }
  begin() { this.n = 0; }
  push(x, y, z, size, r, g, b, a = 1) {
    if (this.n >= this.cap) return;
    const i = this.n++;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.col[i * 4] = r; this.col[i * 4 + 1] = g; this.col[i * 4 + 2] = b; this.col[i * 4 + 3] = a;
    this.size[i] = size;
  }
  end() {
    this.geom.setDrawRange(0, this.n);
    for (const k of ['position', 'acolor', 'asize']) { const at = this.geom.attributes[k]; at.needsUpdate = true; at.updateRange.count = this.n * at.itemSize; at.updateRange.offset = 0; }
  }
}

// ---- particles -----------------------------------------------------------------
const Particles = {
  list: [], max: 2600, batch: null,
  emit(x, y, z, vx, vy, vz, life, size, r, g, b, grav = 0, drag = 1.5) {
    if (this.list.length >= this.max) this.list.shift();
    this.list.push({ x, y, z, vx, vy, vz, life, t: 0, size, r, g, b, grav, drag });
  },
  burst(x, y, z, n, speed, life, size, r, g, b, grav = 0, up = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = speed * (0.4 + Math.random() * 0.6);
      this.emit(x, y, z, Math.cos(a) * s, (0.3 + Math.random()) * speed * 0.5 * up, Math.sin(a) * s, life * (0.6 + Math.random() * 0.6), size * (0.6 + Math.random() * 0.6), r, g, b, grav);
    }
  },
  update(dt) {
    const L = this.list, b = this.batch;
    let w = 0;
    for (let i = 0; i < L.length; i++) {
      const p = L[i]; p.t += dt;
      if (p.t >= p.life) continue;
      const k = Math.exp(-p.drag * dt);
      p.vx *= k; p.vz *= k; p.vy = p.vy * k - p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.3; }
      L[w++] = p;
    }
    L.length = w;
    b.begin();
    for (const p of L) { const f = 1 - p.t / p.life; b.push(p.x, p.y, p.z, p.size * (0.4 + 0.6 * f), p.r, p.g, p.b, f); }
    b.end();
  },
};

// ---- ground ---------------------------------------------------------------------
const GroundLights = {
  n: 0, pos: [], col: [],
  init() { for (let i = 0; i < 10; i++) { this.pos.push(new THREE.Vector4()); this.col.push(new THREE.Vector3()); } },
  begin() { this.n = 0; },
  push(x, z, r, intensity, cr, cg, cb) { if (this.n >= 10) return; this.pos[this.n].set(x, z, r, intensity); this.col[this.n].set(cr, cg, cb); this.n++; },
};
function makeGroundMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uAmb: { value: new THREE.Color(0.15, 0.18, 0.26) }, uLPos: { value: new THREE.Vector3() }, uLCol: { value: new THREE.Color(1, 0.62, 0.27) },
      uLRange: { value: 17 }, uLDecay: { value: 1.75 }, uFog: { value: new THREE.Color(0x070a12) }, uFogN: { value: 20 }, uFogF: { value: 50 },
      uGL: { value: GroundLights.pos }, uGLC: { value: GroundLights.col }, uGLN: { value: 0 }, uTime: { value: 0 },
    },
    vertexShader: `varying vec3 vW; varying float vFD; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vec4 mv=viewMatrix*w; vFD=-mv.z; gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `
      uniform vec3 uAmb; uniform vec3 uLPos; uniform vec3 uLCol; uniform float uLRange; uniform float uLDecay; uniform vec3 uFog; uniform float uFogN; uniform float uFogF;
      uniform vec4 uGL[10]; uniform vec3 uGLC[10]; uniform int uGLN; uniform float uTime;
      varying vec3 vW; varying float vFD;
      float h(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1.,0.)),u.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),u.x),u.y); }
      float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*vn(p); p=p*2.03+17.1; a*=.5; } return v*1.14; }
      void main(){
        vec2 p=vW.xz;
        float n1=fbm(p*.045), n2=fbm(p*.16+31.), n3=vn(p*2.7), n4=vn(p*9.0+5.);
        vec3 moss=vec3(.13,.18,.14), heather=vec3(.19,.135,.2), peat=vec3(.14,.115,.095), pale=vec3(.2,.22,.18);
        vec3 col=mix(moss,heather,smoothstep(.42,.68,n1));
        col=mix(col,peat,smoothstep(.5,.78,n2)*.8);
        col=mix(col,pale,smoothstep(.62,.8,n1*.6+n3*.4)*.45);
        col*=.72+.38*n3; col*=.88+.24*n4;
        float dl=distance(uLPos.xz,vW.xz);
        float att=pow(clamp(1.-dl/uLRange,0.,1.),uLDecay);
        vec3 light=uAmb+uLCol*att*1.1;
        for(int i=0;i<10;i++){ if(i>=uGLN) break; vec4 g=uGL[i]; float d=distance(p,g.xy); light+=uGLC[i]*g.w*pow(clamp(1.-d/g.z,0.,1.),2.); }
        vec3 c=col*light;
        float f=smoothstep(uFogN,uFogF,vFD);
        gl_FragColor=vec4(mix(c,uFog,clamp(f,0.,1.)),1.);
      }`,
  });
}

// ---- the world object ---------------------------------------------------------------
const World = {
  ground: null, groundMat: null, lantern: null, moon: null, hemi: null, props: [], colliders: [], mist: [], breakables: [],
  batches: {}, glow: null, shadow: null, dawn: 0, dim: 0, quality: 'high',

  init(container) {
    this.quality = Save.data.opts.quality;
    renderer = new THREE.WebGLRenderer({ antialias: this.quality === 'high', powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, this.quality === 'high' ? 1.75 : 1));
    renderer.setClearColor(SKY.night.bg);
    container.insertBefore(renderer.domElement, container.firstChild);
    renderer.domElement.id = 'gl';
    scene = new THREE.Scene();
    scene.background = SKY.night.bg.clone();
    scene.fog = new THREE.Fog(SKY.night.fog.getHex(), 20, 50);

    this.hemi = new THREE.HemisphereLight(0x55648a, 0x14160f, SKY.night.hemi); scene.add(this.hemi);
    this.moon = new THREE.DirectionalLight(0x8fa6d8, SKY.night.moon); this.moon.position.set(-0.5, 1, 0.35); scene.add(this.moon);
    this.lantern = new THREE.PointLight(0xffa64a, 1.75, 17, 1.4); scene.add(this.lantern);

    this.groundMat = makeGroundMaterial();
    this.ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), this.groundMat);
    this.ground.rotation.x = -Math.PI / 2; scene.add(this.ground);

    this.buildProps();
    this.buildMist();
    this.glow = new PointBatch(1400, true);
    Particles.batch = new PointBatch(Particles.max, true);
    const shTex = this.radialTexture();
    this.shadow = new Batch(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false, color: 0x000000, opacity: 0.55 }), 1200);
    this.shadow.mesh.renderOrder = -1;
    this.resize();
  },
  radialTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.5, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(c); return t;
  },
  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    const ps = renderer.getPixelRatio() * h / (2 * Math.tan((camera.fov * Math.PI) / 360));
    this.glow.mat.uniforms.uScale.value = ps; Particles.batch.mat.uniforms.uScale.value = ps;
  },
  setQuality(q) { this.quality = q; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q === 'high' ? 1.75 : 1)); this.resize(); },
  dropResolution() { const r = renderer.getPixelRatio(); if (r <= 1) return false; renderer.setPixelRatio(Math.max(1, r - 0.5)); this.resize(); return true; },

  buildProps() {
    const lam = new THREE.MeshLambertMaterial({ vertexColors: true });
    const scatter = (n, minR, fn) => { const out = []; for (let i = 0; i < n; i++) { let x, z; do { x = rand(-FIELD / 2, FIELD / 2); z = rand(-FIELD / 2, FIELD / 2); } while (x * x + z * z < minR * minR); out.push(Object.assign({ x, z, ry: rand(0, TAU), s: 1 }, fn ? fn(i) : {})); } return out; };
    const addSet = (geom, mat, items, collR, yFn) => {
      const mesh = new THREE.InstancedMesh(geom, mat, items.length); mesh.frustumCulled = false; scene.add(mesh);
      const set = { mesh, items, collR, yFn: yFn || (() => 0), dirty: true };
      this.props.push(set);
      if (collR) for (const it of items) { it.cr = collR * it.s; this.colliders.push(it); }

    };
    // dead trees
    const tree = merge([
      part(Cyl(0.16, 0.3, 3.2, 6), 0x2a231d, [0, 1.6, 0]),
      part(Cyl(0.06, 0.12, 1.6, 5), 0x2a231d, [0.45, 2.6, 0], [0, 0, -0.8]), part(Cyl(0.05, 0.1, 1.3, 5), 0x2a231d, [-0.4, 2.9, 0.15], [0.2, 0, 0.75]),
      part(Cyl(0.04, 0.07, 1.0, 4), 0x2a231d, [0.1, 3.4, -0.35], [-0.6, 0, 0.1]), part(Cyl(0.03, 0.05, 0.8, 4), 0x2a231d, [0.95, 3.1, 0.1], [0, 0, -0.3]),
      part(Cyl(0.03, 0.05, 0.7, 4), 0x2a231d, [-0.85, 3.3, 0.2], [0.2, 0, 0.35]), part(Cone(0.5, 0.5, 6), 0x231d18, [0, 0.2, 0]),
    ]);
    addSet(tree, lam, scatter(34, 6, () => ({ s: rand(0.8, 1.35) })), 0.42);
    // standing stones
    const stone = merge([part(jitter(new THREE.BoxGeometry(0.9, 2.4, 0.5, 2, 3, 1), 0.12, 11), 0x4a4d55, [0, 1.15, 0]), part(jitter(Ico(0.3, 0), 0.08, 4), 0x2e3036, [0.3, 0.05, 0.2], [0, 0, 0], [1, 0.4, 1])]);
    addSet(stone, lam, scatter(22, 7, () => ({ s: rand(0.7, 1.3), tilt: rand(-0.12, 0.12) })), 0.6);
    // graves
    const grave = merge([part(Box(0.6, 0.85, 0.16), 0x55585e, [0, 0.42, 0]), part(Cyl(0.3, 0.3, 0.16, 10), 0x55585e, [0, 0.85, 0], [Math.PI / 2, 0, 0]), part(Box(0.7, 0.1, 1.2), 0x2c2a24, [0, 0.03, 0.55])]);
    const cross = merge([part(Box(0.14, 1.3, 0.14), 0x4d5056, [0, 0.65, 0]), part(Box(0.7, 0.14, 0.14), 0x4d5056, [0, 0.95, 0]), part(Cyl(0.24, 0.24, 0.05, 10), 0x4d5056, [0, 0.95, 0], [Math.PI / 2, 0, 0])]);
    addSet(grave, lam, scatter(26, 5, () => ({ s: rand(0.85, 1.15), tilt: rand(-0.2, 0.2) })), 0.35);
    addSet(cross, lam, scatter(14, 5, () => ({ s: rand(0.9, 1.3), tilt: rand(-0.25, 0.25) })), 0.25);
    // rocks, grass, heather (decor only)
    const rock = merge([part(jitter(Ico(0.4, 0), 0.12, 5), 0x3f4148, [0, 0.1, 0], [0, 0, 0], [1, 0.55, 1])]);
    addSet(rock, lam, scatter(140, 0, () => ({ s: rand(0.4, 1.4) })));
    const blades = [];
    for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI; blades.push(part(Box(0.04, 0.5, 0.01), i % 2 ? 0x3e4c35 : 0x33402e, [Math.cos(a) * 0.06, 0.22, Math.sin(a) * 0.06], [rand(-0.35, 0.35), a, rand(-0.35, 0.35)])); }
    addSet(merge(blades), lam, scatter(1100, 0, () => ({ s: rand(0.7, 1.6) })));
    const heath = merge([part(Ico(0.13, 0), 0x55305e, [0, 0.12, 0]), part(Ico(0.1, 0), 0x633a6c, [0.12, 0.1, 0.05]), part(Ico(0.09, 0), 0x4a2a52, [-0.08, 0.09, 0.1]), part(Box(0.02, 0.2, 0.02), 0x3a4530, [0, 0.05, 0])]);
    addSet(heath, lam, scatter(320, 0, () => ({ s: rand(0.8, 1.7) })));
    // breakable wayside candles
    const shrine = merge([part(jitter(Box(0.62, 0.3, 0.5), 0.05, 2), 0x5c5d63, [0, 0.15, 0]), part(Cyl(0.05, 0.05, 0.3, 6), 0xe8dcc0, [-0.15, 0.45, 0.05]), part(Cyl(0.05, 0.05, 0.42, 6), 0xe8dcc0, [0.05, 0.51, -0.06]), part(Cyl(0.05, 0.05, 0.24, 6), 0xe8dcc0, [0.18, 0.42, 0.1])]);
    const flames = merge([part(Cone(0.05, 0.12, 5), 0xffffff, [-0.15, 0.66, 0.05]), part(Cone(0.05, 0.12, 5), 0xffffff, [0.05, 0.78, -0.06]), part(Cone(0.05, 0.12, 5), 0xffffff, [0.18, 0.6, 0.1])]);
    this.bShrine = new Batch(shrine, lam, 12); this.bFlame = new Batch(flames, new THREE.MeshBasicMaterial({ color: 0xffd28a, fog: false }), 12);

    for (const set of this.props) this.writeSet(set);
  },
  writeSet(set) {

function lightning(w, s, x, z, dmg, r, main) {
  forEnemiesIn(x, z, r, (e, dx, dz, d2) => { const d = Math.sqrt(d2) || 1; hurtEnemy(e, dmg, w, dx / d, dz / d, 0.6); });
  hitBreakables(x, z, r);
  if (main) fxs.push({ kind: 'strike', x, z, r, t: 0, life: 0.32, seed: Math.random() * 99 });
  Particles.burst(x, 0.3, z, 14, 5, 0.5, 0.28, 0.75, 0.85, 1, 4);
  Game.shake(0.12);
  Sound.zap();
}

function updateShots(dt) {
  let w = 0;
  for (let i = 0; i < shots.length; i++) {
    const s = shots[i];
    s.t += dt;
    let alive = s.t < s.life;
    switch (s.kind) {
      case 'bolt': case 'nail': {
        s.x += s.vx * dt; s.z += s.vz * dt;
        forEnemiesIn(s.x, s.z, s.r, (e, dx, dz, d2) => {
          if (s.hitN >= s.pierce || s.hits.has(e.id)) return;
          s.hits.add(e.id); s.hitN++;
          const sp = Math.hypot(s.vx, s.vz) || 1;
          hurtEnemy(e, s.dmg, s.src, s.vx / sp, s.vz / sp, s.kb);
        });
        hitBreakables(s.x, s.z, s.r);
        if (s.hitN >= s.pierce) alive = false;
        if (s.kind === 'bolt' && Math.random() < 0.7) Particles.emit(s.x, s.y, s.z, rand(-0.3, 0.3), rand(0, 0.4), rand(-0.3, 0.3), 0.35, s.evo ? 0.32 : 0.26, 1, 0.6, 0.22, 0, 2);
        break;
      }
      case 'sickle': {
        const v = s.v0 * Math.cos((Math.PI * s.t) / s.T);
        s.x += s.dx * v * dt; s.z += s.dz * v * dt; s.spin += dt * 16;
        sweep(s, 0.35);
        break;
      }
      case 'reaper': {
        const k = Math.sin((Math.PI * s.t) / s.life), R = 0.8 + 7.5 * k * Math.sqrt(s.s.areaMul), a = s.a0 + s.s.speed * s.t;
        s.x = P.x + Math.cos(a) * R; s.z = P.z + Math.sin(a) * R; s.spin += dt * 18;
        sweep(s, 0.3);
        if (Math.random() < 0.5) Particles.emit(s.x, 0.9, s.z, 0, 0.3, 0, 0.4, 0.3, 0.75, 0.6, 1, 0, 1);
        break;
      }
      case 'throw': {
        const f = Math.min(1, s.t / s.life);
        s.x = lerp(s.sx, s.tx, f); s.z = lerp(s.sz, s.tz, f); s.y = 1 + Math.sin(f * Math.PI) * 3.2 - f * 0.9;
        if (f >= 1) {
          alive = false;
          const st = s.s;
          shots.push({ kind: 'pool', x: s.tx, z: s.tz, r: st.radius, life: st.dur, t: 0, tick: st.tick, tt: 0, dmg: st.dmg, src: s.src, evo: s.src.evo });
          Particles.burst(s.tx, 0.3, s.tz, 16, 4, 0.6, 0.3, 1, 0.5, 0.15, 3);
          Sound.fwoosh();
        }
        break;
      }
      case 'pool': {
        if (s.evo) {
          const n = nearestEnemies(s.x, s.z, 1, 14)[0];
          if (n) { const dx = n.x - s.x, dz = n.z - s.z, d = Math.hypot(dx, dz) || 1; s.x += (dx / d) * 2.4 * dt; s.z += (dz / d) * 2.4 * dt; }
        }
        if ((s.tt -= dt) <= 0) {
          s.tt += s.tick;
          forEnemiesIn(s.x, s.z, s.r, (e) => hurtEnemy(e, s.dmg, s.src, 0, 0, 0));
          hitBreakables(s.x, s.z, s.r);
        }
        if (Math.random() < dt * 22 * s.r) { const a = rand(0, TAU), r = Math.sqrt(Math.random()) * s.r; Particles.emit(s.x + Math.cos(a) * r, 0.1, s.z + Math.sin(a) * r, 0, rand(0.8, 2), 0, rand(0.4, 0.8), rand(0.25, 0.45), 1, rand(0.35, 0.6), 0.12, -1, 1); }
        break;
      }
      case 'ebolt': {
        s.x += s.vx * dt; s.z += s.vz * dt;
        const dx = s.x - P.x, dz = s.z - P.z;
        if (dx * dx + dz * dz < (s.r + P.r) ** 2 && P.hp > 0) { Game.hurtPlayer(s.dmg, 'bullet'); alive = false; Particles.burst(s.x, 1, s.z, 8, 2, 0.4, 0.3, 0.8, 0.5, 1); }
        break;
      }
    }
    if (alive) shots[w++] = s;
  }
  shots.length = w;
}
function sweep(s, gap) {

    if (!s.src.hitOK(e, gap)) return;

}

    for (let i = 0; i < n; i++) {

    const g = Math.round(randi(8, 20) * tier * luck); this.addGold(g);

  // ----- level up -----
  rollChoices() {
    const pool = [];
    const owned = new Set(P.weapons.map((w) => w.id)), gone = new Set(P.weapons.filter((w) => w.evo).map((w) => EVOS[w.id].from));
    const wantPair = new Set(P.weapons.filter((w) => !w.evo && w.level >= 5).map((w) => w.def.pair));
    for (const w of P.weapons) if (!w.evo && w.level < 8) pool.push({ type: 'w', id: w.id, w: 3.2 });
    if (P.weapons.length < 6) for (const id in WEAPONS) if (!owned.has(id) && !gone.has(id)) pool.push({ type: 'w', id, isNew: true, w: 1.5 });
    for (const p of P.passives) if (p.level < PASSIVES[p.id].max) pool.push({ type: 'p', id: p.id, w: 2.3 });
    if (P.passives.length < 6) for (const id in PASSIVES) if (!P.passives.find((p) => p.id === id)) pool.push({ type: 'p', id, isNew: true, w: wantPair.has(id) ? 2.6 : 1.3 });
    const n = Math.random() < 0.05 + (P.stats.luck - 1) * 0.5 ? 4 : 3;
    const out = [];
    while (out.length < n && pool.length) { const c = weightedPick(pool, (x) => x.w); out.push(c); pool.splice(pool.indexOf(c), 1); }
    if (!out.length) out.push({ type: 'heal' }, { type: 'gold' });
    return out;
  },
  applyChoice(c) {

    } else if (c.type === 'p') {
      if (c.isNew) { P.passives.push({ id: c.id, level: 1 }); Save.data.codex.p[c.id] = true; }
      else P.passives.find((x) => x.id === c.id).level++;
      recomputeStats();
    } else if (c.type === 'heal') healPlayer(30);
    else if (c.type === 'gold') this.addGold(25);
    UI.renderSlots();
  },

  // ----- per-frame -----
  tick(dt) {
    this.bannerT -= dt;
    if (this.bannerT <= 0) $('#banner').classList.remove('on');
    switch (this.state) {
      case 'play': this.update(dt); break;
      case 'dying': {
        this.dieT += dt;
        const k = Math.max(0, 1 - this.dieT / 2.2);
        this.updateEnemies(dt * 0.25); Particles.update(dt * 0.4);
        this.lanternFade = k;
        if (this.dieT > 2.6) this.endRun(false);
        break;
      }
      case 'dawn': {
        this.dawnT += dt;
        World.dawn = Math.min(1, this.dawnT / 3);
        World.applySky();
        for (const e of enemies) if (!e.dead && Math.random() < dt * 2.2) killEnemy(e, null, true);
        this.updateEnemies(dt * 0.5); Particles.update(dt); updateShots(0);
        if (this.dawnT > 4.2) this.endRun(true);
        break;
      }
      case 'title': this.titleUpdate(dt); break;
    }
    this.shakeAmt = Math.max(0, this.shakeAmt - dt * 1.8);
  },
  update(dt) {
    this.time += dt;
    // lead-in to dawn: the sky greys over the final two minutes
    const pre = clamp((this.time - (NIGHT_LENGTH - 120)) / 120, 0, 1);
    World.dawn = pre * 0.22;
    const dimTarget = this.boss && this.boss.kind === 'longnight' ? 1 : 0;
    World.dim = lerp(World.dim, dimTarget, dt * 0.6);
    World.applySky();
    if (this.time >= NIGHT_LENGTH) {
      if (this.boss && !this.boss.dead) killEnemy(this.boss, null, true);
      this.startDawn(); return;
    }
    // player
    const st = P.stats, v = Input.vector();
    const spd = 5.4 * st.speed;
    P.moving = Math.hypot(v.x, v.y) > 0.05;
    if (P.moving) { const d = Math.hypot(v.x, v.y); P.fx = v.x / d; P.fz = v.y / d; }
    P.x += v.x * spd * dt; P.z += v.y * spd * dt;
    for (const c of World.colliders) {
      const dx = P.x - c.x, dz = P.z - c.z, rr = c.cr + P.r, d2 = dx * dx + dz * dz;
      if (d2 < rr * rr && d2 > 1e-6) { const d = Math.sqrt(d2); P.x = c.x + (dx / d) * rr; P.z = c.z + (dz / d) * rr; }
    }
    P.iframes -= dt;
    if (st.regen > 0) { P.regenAcc += st.regen * dt; if (P.regenAcc >= 1) { healPlayer(Math.floor(P.regenAcc)); P.regenAcc -= Math.floor(P.regenAcc); } }
    // world
    World.update(dt, P.x, P.z, this.time);
    this.director(dt);
    for (const w of P.weapons) { w.ang = w.ang || 0; WB[w.id](w, w.stats(), dt); }
    updateShots(dt);
    this.updateEnemies(dt);
    this.updatePickups(dt);
    Particles.update(dt);
    // fx lifetimes
    let k = 0;
    for (const f of fxs) { f.t += dt; if (f.t < f.life) fxs[k++] = f; }
    fxs.length = k;
    // music intensity
    Sound.setIntensity(clamp(this.time / NIGHT_LENGTH + enemies.length / 900, 0, 1), !!this.boss);
    // queued level-ups and chests
    if (this.chestQueue.length) { const tier = this.chestQueue.shift(); this.state = 'chest'; Input.endJoy(); UI.showChest(this.resolveChest(tier), tier); return; }
    if (this.pendingLevels > 0) { this.pendingLevels--; this.state = 'levelup'; Input.endJoy(); UI.showLevelUp(this.rollChoices()); }
  },
  director(dt) {
    const t = this.time, m = Math.min(WAVES.length - 1, Math.floor(t / 60)), W = WAVES[m], D = this.dir;
    if (W.boss && !D.bossDone[m]) { D.bossDone[m] = true; this.spawnBoss(W.boss); }
    if (W.elite && !D.eliteDone[m] && t - m * 60 > 30) { D.eliteDone[m] = true; this.spawnElite(W.elite); }
    while (this.eventIdx < EVENTS.length && EVENTS[this.eventIdx].t <= t) { this.runEvent(EVENTS[this.eventIdx]); this.eventIdx++; }
    let alive = 0;
    for (const e of enemies) if (!e.dead && !e.boss && !e.flock) alive++;
    const hardCap = World.quality === 'high' ? 420 : 280;
    const cap = Math.min(W.cap, hardCap);
    if (alive < cap) {
      D.acc += dt * W.rate * (alive < cap * 0.5 ? 2.5 : 1);
      while (D.acc >= 1) { D.acc -= 1; const k = weightedPick(Object.keys(W.mix), (x) => W.mix[x]); const [x, z] = this.spawnPoint(); spawnEnemy(k, x, z); }
    } else D.acc = 0;
  },
  spawnPoint(r) {
    const R = r || this.viewR + rand(0, 3);

        m.position.set(P.x, 0.7, P.z); m.rotation.y = f.ang + (f.full ? k * 3 : (k - 0.5) * 0.8);
        const sc = f.R * (0.75 + 0.25 * k); m.scale.set(sc, 1, sc);
        m.material.opacity = (1 - k) * (f.full ? 0.6 : 0.95);
        m.material.color.setHex(f.full ? 0xff7a6a : 0xffe2b0);
      } else if ((f.kind === 'strike' || f.kind === 'bolt') && bi < R.bolts.length) {
        const m = R.bolts[bi++]; m.visible = true;
        if (f.kind === 'strike') this.boltGeom(m, f.x, 16, f.z, f.x, 0, f.z, f.seed, 0.38);
        else this.boltGeom(m, f.x0, f.y0, f.z0, f.x1, f.y1, f.z1, f.seed, 0.22);
        m.material.opacity = (1 - k) * (Math.random() < 0.3 ? 0.5 : 1);
        if (f.kind === 'strike') { GroundLights.push(f.x, f.z, f.r * 3.5, 2.4 * (1 - k), 0.7, 0.8, 1); World.glow.push(f.x, 0.4, f.z, f.r * 3, 0.6, 0.75, 1, 1 - k); }
      } else if (f.kind === 'tele' && ti < R.tele.length) {
        const m = R.tele[ti++]; m.visible = true;
        const L = f.len;
        m.position.set(f.x + (f.dx * L) / 2, 0.05, f.z + (f.dz * L) / 2);
        m.rotation.y = Math.atan2(f.dx, f.dz); m.scale.set(f.w, 1, L);
        m.material.opacity = 0.18 + 0.25 * Math.abs(Math.sin(f.t * 14));
      }
    }
    World.shadow.end(); World.glow.end();
    if (this.lightPos) World.setLantern(this.lightPos.x, this.lightPos.y, this.lightPos.z, this.lightI, this.lightR);
    World.groundMat.uniforms.uGLN.value = GroundLights.n;
    this.drawOverlay(dt);
    if (this.state === 'play') this.updateHUD(dt);
  },
  boltGeom(m, x0, y0, z0, x1, y1, z1, seed, w) {
    const pos = m.geometry.attributes.position, a = pos.array, N = 12;
    const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
    // side vector perpendicular to bolt and view
    const vx = 0, vy = -0.84, vz = -0.54;
    let sx = dy * vz - dz * vy, sy = dz * vx - dx * vz, sz = dx * vy - dy * vx;
    const sl = Math.hypot(sx, sy, sz) || 1; sx /= sl; sy /= sl; sz /= sl;
    const L = Math.hypot(dx, dy, dz);
    let px = x0, py = y0, pz = z0, s = seed + Math.floor(performance.now() / 50);
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280 - 0.5; };
    let o = 0;
    for (let i = 1; i <= N; i++) {
      const f = i / N, j = i === N ? 0 : L * 0.06;
      const nx = x0 + dx * f + rnd() * j * 2, ny = y0 + dy * f + rnd() * j * 0.5, nz = z0 + dz * f + rnd() * j * 2;
      const w0 = w * (1 - (i - 1) / N * 0.5), w1 = w * (1 - f * 0.5);
      const q = [[px - sx * w0, py - sy * w0, pz - sz * w0], [px + sx * w0, py + sy * w0, pz + sz * w0], [nx + sx * w1, ny + sy * w1, nz + sz * w1], [nx - sx * w1, ny - sy * w1, nz - sz * w1]];
      for (const idx of [0, 1, 2, 0, 2, 3]) { a[o++] = q[idx][0]; a[o++] = q[idx][1]; a[o++] = q[idx][2]; }
      px = nx; py = ny; pz = nz;
    }
    pos.needsUpdate = true;
  },
  drawOverlay(dt) {
    const c = this.fxc, W = innerWidth, H = innerHeight;
    c.clearRect(0, 0, W, H);
    if (this.state === 'title' || this.state === 'boot' || this.state === 'results') return;
    const live = this.state === 'play' || this.state === 'dying' || this.state === 'dawn';
    const proj = (x, y, z) => { _v.set(x, y, z).project(camera); return [(_v.x * 0.5 + 0.5) * W, (-_v.y * 0.5 + 0.5) * H, _v.z]; };
    // damage numbers
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    let w = 0;
    for (const n of this.nums) {
      if (live) n.t += dt;
      if (n.t > 0.6) continue;
      this.nums[w++] = n;
      const [sx, sy] = proj(n.x, n.y + n.t * 1.4, n.z);
      const a = n.t < 0.4 ? 1 : 1 - (n.t - 0.4) / 0.2;
      c.globalAlpha = a;
      c.font = `${n.big ? 700 : 600} ${n.big ? 18 : 13}px "Barlow Semi Condensed", "Arial Narrow", sans-serif`;
      c.lineWidth = 3.5; c.strokeStyle = 'rgba(0,0,0,.85)'; c.strokeText(n.v, sx, sy);
      c.fillStyle = n.big ? '#ffd890' : '#f3ecdf'; c.fillText(n.v, sx, sy);
    }
    this.nums.length = w; c.globalAlpha = 1;
    // health bar under the wanderer
    if (P.hp > 0) {
      const [sx, sy] = proj(P.x, -0.15, P.z);
      const bw = 46, f = clamp(P.hp / P.maxHp, 0, 1);
      c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(sx - bw / 2 - 1, sy + 4, bw + 2, 6);
      c.fillStyle = f < 0.3 ? '#ff5a3c' : '#e8573f'; c.fillRect(sx - bw / 2, sy + 5, bw * f, 4);
    }
    // edge markers for chests and the boss
    const marks = [];
    for (const p of pickups) if (p.kind === 'chest') marks.push([p.x, p.z, '#ffb24a']);
    if (this.boss && !this.boss.dead) marks.push([this.boss.x, this.boss.z, '#ff5a3c']);
    for (const [x, z, col] of marks) {
      const [sx, sy, sz] = proj(x, 0.5, z);
      const m = 34;
      if (sz < 1 && sx > m && sx < W - m && sy > m + 60 && sy < H - m) continue;
      const [px, py] = proj(P.x, 0.5, P.z);
      const ang = Math.atan2(sy - py, sx - px);
      const ex = clamp(px + Math.cos(ang) * 2000, m, W - m), ey = clamp(py + Math.sin(ang) * 2000, m + 60, H - m);
      const t2 = Math.min((ex - px) / (Math.cos(ang) || 1e-6), (ey - py) / (Math.sin(ang) || 1e-6));
      const ax = clamp(px + Math.cos(ang) * Math.abs(t2), m, W - m), ay = clamp(py + Math.sin(ang) * Math.abs(t2), m + 60, H - m);
      c.save(); c.translate(ax, ay); c.rotate(ang);
      c.fillStyle = col; c.globalAlpha = 0.85 + Math.sin(performance.now() / 150) * 0.15;
      c.beginPath(); c.moveTo(12, 0); c.lineTo(-7, -8); c.lineTo(-3, 0); c.lineTo(-7, 8); c.closePath(); c.fill();
      c.restore();
    }
    c.globalAlpha = 1;
  },
  updateHUD(dt) {
    this.hudT -= dt;
    if (this.hudT > 0) return;
    this.hudT = 0.1;
    const L = this.lastHud, set = (id, v, prop = 'textContent') => { if (L[id] !== v) { L[id] = v; const el = document.getElementById(id); if (prop === 'width') el.style.width = v; else el[prop] = v; } };
    set('xpfill', (clamp(P.xp / P.xpNext, 0, 1) * 100).toFixed(1) + '%', 'width');
    set('lvl', 'LV ' + P.level);
    set('time', fmtTime(this.time));
    set('dawnfill', ((this.time / NIGHT_LENGTH) * 100).toFixed(1) + '%', 'width');
    set('dawnlabel', 'Dawn in ' + fmtTime(NIGHT_LENGTH - this.time));
    set('kills', fmtNum(this.kills));
    set('gold', fmtNum(this.runGold));
    const b = this.boss && !this.boss.dead ? this.boss : null;
    $('#bossbar').hidden = !b;
    if (b) { set('bossname', b.def.name); set('bossfill', ((b.hp / b.maxHp) * 100).toFixed(1) + '%', 'width'); }
  },
};

// ==== 60-ui.js ====
// ---------------------------------------------------------------------------
// UI: screens, HUD slots, navigation
// ---------------------------------------------------------------------------
const SCREENS = ['title', 'chars', 'shrine', 'codex', 'options', 'levelup', 'chest', 'pause', 'results'];
const tallowTag = (n) => `<span class="tallow num"><i>${icon('coin')}</i>${fmtNum(n)}</span>`;
const itemName = (id) => (WEAPONS[id] || EVOS[id] || PASSIVES[id] || {}).name || id;
const itemIcon = (id) => (WEAPONS[id] || EVOS[id] || PASSIVES[id] || {}).icon || 'skull';

const UI = {
  current: null, returnTo: 'title', choices: null, chestTier: 1, codexTab: 'arms', confirmReset: false, confirmQuit: false,

  init() {
    $('#pauseBtn').innerHTML = icon('pause');
    $('#pauseBtn').addEventListener('click', () => Game.pause());
    $('#killIco').innerHTML = icon('skull'); $('#goldIco').innerHTML = icon('coin');
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      Sound.ui();
      const act = b.dataset.act;
      if (act) this.act(act, b);
    });
    document.addEventListener('focusin', (e) => { if (e.target.tagName === 'BUTTON' && this.current) Sound.uiMove(); });
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'opt-music') { Save.data.opts.music = +t.value; Sound.setVolumes(); Save.save(); }
      if (t.id === 'opt-sfx') { Save.data.opts.sfx = +t.value; Sound.setVolumes(); Save.save(); }
    });
    addEventListener('keydown', (e) => this.key(e));
  },
  key(e) {
    if (Game.state === 'play') {
      if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); Game.pause(); }
      return;
    }
    if (!this.current) return;
    if (e.code === 'Escape' || e.code === 'Backspace') { e.preventDefault(); this.back(); return; }
    if (this.current === 'levelup' && /^Digit[1-4]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (this.choices && this.choices[i]) this.choose(i); return; }
    if (this.current === 'levelup' && e.code === 'KeyR') { this.act('reroll'); return; }
    if (['ArrowDown', 'ArrowRight', 'KeyS', 'KeyD'].includes(e.code)) { e.preventDefault(); this.nav(1); }
    if (['ArrowUp', 'ArrowLeft', 'KeyW', 'KeyA'].includes(e.code)) { e.preventDefault(); this.nav(-1); }
    if (e.code === 'Space' && document.activeElement && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); this.nav(1); }
  },
  nav(dir) {
    const scr = this.current && $('#' + this.current);
    if (!scr) return;
    const items = $$('button:not([disabled]), input', scr).filter((b) => b.offsetParent !== null);
    if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    const n = i < 0 ? (dir > 0 ? 0 : items.length - 1) : (i + dir + items.length) % items.length;
    items[n].focus({ preventScroll: false });
    items[n].scrollIntoView({ block: 'nearest' });
  },
  back() {
    const c = this.current;
    if (['chars', 'shrine', 'codex'].includes(c)) this.title();
    else if (c === 'options') { if (this.returnTo === 'pause') this.showPause(); else this.title(); }
    else if (c === 'pause') Game.resume();
    else if (c === 'chest') this.act('take');
    else if (c === 'results') this.title();
  },
  hideAll() { for (const s of SCREENS) $('#' + s).hidden = true; this.current = null; },
  show(id, html) {
    this.hideAll();
    const el = $('#' + id);
    if (html != null) el.innerHTML = html;
    el.hidden = false; this.current = id; el.scrollTop = 0;
    requestAnimationFrame(() => { const f = el.querySelector('[data-autofocus]') || el.querySelector('button:not([disabled])'); if (f) f.focus({ preventScroll: true }); });
  },
  showHUD(on) { $('#hud').hidden = !on; $('#fps').hidden = !(on && Save.data.opts.fps); },

  // ---------------- title ----------------
  title() {
    if (Game.state !== 'title') Game.enterTitle();
    const s = Save.data.stats;
    this.show('title', `<div class="inner">
      <h1><span>A night on the moor</span>Gloamward</h1>
      <p class="tag">Carry the lantern through fifteen minutes of dark. Everything in the bog is drawn to the light.</p>
      <nav class="menu" aria-label="Main menu">
        <button class="primary" data-act="chars" data-autofocus>Begin the vigil</button>
        <button data-act="shrine">Shrine</button>
        <button data-act="codex">Codex</button>
        <button data-act="options">Options</button>

  codex() {
